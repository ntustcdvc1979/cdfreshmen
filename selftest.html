<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><title>logic test</title></head>
<body><pre id="out">running…</pre>
<script type="module">
import {
  buildLeaderboard, buildCategoryMatrix, categoryChampions,
  groupBestCategories, columnWinners, tallyQuestion, categoryOf, parseBulkQuestions
} from "./assets/js/common.js";

const log = [];
const ok = (name, cond, extra="") => log.push(`${cond ? "PASS" : "FAIL"}  ${name}${extra ? "  " + extra : ""}`);

// --- 佈景：3 組、4 題（2 個類別）---
const groups = {
  g1: { name: "第 1 組", order: 0 },
  g2: { name: "第 2 組", order: 1 },
  g3: { name: "第 3 組", order: 2 }
};
const questions = {
  q1: { order: 0, text: "T1", a: "a", b: "b", cat: "social"  },
  q2: { order: 1, text: "T2", a: "a", b: "b", cat: "social"  },
  q3: { order: 2, text: "T3", a: "a", b: "b", cat: "emotion" },
  q4: { order: 3, text: "T4", a: "a", b: "b", cat: "emotion" }   // 未公布
};
const keys = { q1: "A", q2: "A", q3: "B", q4: "A" };
const revealed = { q1: true, q2: true, q3: true };               // q4 沒公布

// 第1組：人際 2/2 全對、情緒 0/1
// 第2組：人際 1/2、情緒 1/1 全對
// 第3組：只答了情緒 1 題且答錯
const responses = {
  q1: { d1: {g:"g1",c:"A"}, d2: {g:"g2",c:"A"} },
  q2: { d1: {g:"g1",c:"A"}, d2: {g:"g2",c:"B"} },
  q3: { d1: {g:"g1",c:"A"}, d2: {g:"g2",c:"B"}, d3: {g:"g3",c:"A"} },
  q4: { d1: {g:"g1",c:"A"}, d2: {g:"g2",c:"A"}, d3: {g:"g3",c:"A"} }   // 應被忽略
};

// --- 1. 單題分布 ---
const t = tallyQuestion(responses.q2, "A");
ok("tallyQuestion 計數", t.A === 1 && t.B === 1 && t.total === 2, JSON.stringify(t));

// --- 2. 總排行榜（未公布的 q4 不能算進去）---
const lb = buildLeaderboard(groups, questions, keys, responses, revealed);
const byId = Object.fromEntries(lb.map(r => [r.gid, r]));
ok("g1 = 2/3", byId.g1.correct === 2 && byId.g1.answered === 3, JSON.stringify(byId.g1));
ok("g2 = 2/3", byId.g2.correct === 2 && byId.g2.answered === 3, JSON.stringify(byId.g2));
ok("g3 = 0/1", byId.g3.correct === 0 && byId.g3.answered === 1, JSON.stringify(byId.g3));
ok("未公布的 q4 未列入", byId.g1.answered === 3);
ok("排序：g3 墊底", lb[lb.length - 1].gid === "g3", lb.map(r=>r.gid+":"+r.rate).join(" "));

// --- 3. 類別矩陣 ---
const mx = buildCategoryMatrix(groups, questions, keys, responses, revealed);
ok("只出現有題目的類別", mx.cats.length === 2 && mx.cats[0].id === "social" && mx.cats[1].id === "emotion",
   mx.cats.map(c=>c.id).join(","));

const cell = (gid, catId) => {
  const r = mx.rows.find(r => r.gid === gid);
  return r.cells[mx.cats.findIndex(c => c.id === catId)];
};
ok("g1 人際 100%", cell("g1","social").rate === 100, JSON.stringify(cell("g1","social")));
ok("g1 情緒 0%",   cell("g1","emotion").rate === 0);
ok("g2 人際 50%",  cell("g2","social").rate === 50);
ok("g2 情緒 100%", cell("g2","emotion").rate === 100);
ok("g3 人際 null（沒作答）", cell("g3","social").rate === null, JSON.stringify(cell("g3","social")));

// --- 4. 各類別冠軍 ---
const champs = Object.fromEntries(categoryChampions(mx).map(c => [c.cat.id, c.best]));
ok("人際冠軍 = 第1組", champs.social?.gid === "g1", JSON.stringify(champs.social));
ok("情緒冠軍 = 第2組", champs.emotion?.gid === "g2", JSON.stringify(champs.emotion));

// --- 5. 各組最強類別 ---
const best = Object.fromEntries(groupBestCategories(mx).map(b => [b.gid, b]));
ok("g1 最強 = 人際",  best.g1.cat?.id === "social",  best.g1.cat?.id);
ok("g2 最強 = 情緒",  best.g2.cat?.id === "emotion", best.g2.cat?.id);
ok("g3 最強 = 情緒（唯一有作答的）", best.g3.cat?.id === "emotion", best.g3.cat?.id);

// --- 6. 欄位冠軍索引 ---
const wins = columnWinners(mx);
ok("columnWinners 指向正確列",
   mx.rows[wins[0]].gid === "g1" && mx.rows[wins[1]].gid === "g2",
   JSON.stringify(wins));

// --- 7. 邊界 ---
const empty = buildCategoryMatrix(groups, questions, keys, {}, {});
ok("完全沒公布 → 沒有類別", empty.cats.length === 0);
ok("未知類別 id 落到未分類", categoryOf("nope").id === "uncat");
ok("沒有 cat 欄位落到未分類", categoryOf(undefined).name === "未分類");

const uncat = buildCategoryMatrix(groups, { qx: { order:0, text:"x" } }, { qx:"A" },
                                  { qx: { d1: {g:"g1",c:"A"} } }, { qx:true });
ok("未分類題目會自成一欄", uncat.cats.length === 1 && uncat.cats[0].id === "uncat",
   uncat.cats.map(c=>c.id).join(","));

// --- 8. 批次匯入解析 ---
const throws = (name, raw, hint) => {
  try { parseBulkQuestions(raw); ok(name + "（應該要報錯）", false); }
  catch (e) { ok(name, hint ? e.message.includes(hint) : true, e.message.slice(0, 46)); }
};

let p = parseBulkQuestions("題幹|甲|乙|丙|丁|C|情緒管理大師");
ok("四選項＋類別", p[0].key === "C" && p[0].q.cat === "emotion" && p[0].q.c === "丙" && p[0].q.text === "題幹",
   JSON.stringify(p[0]));

p = parseBulkQuestions("題幹|甲|乙|丙|丁|B");
ok("四選項、無類別", p[0].key === "B" && p[0].q.cat === undefined && p[0].q.d === "丁", JSON.stringify(p[0].q));

p = parseBulkQuestions("題幹|甲|乙|A");
ok("只有 AB 兩個選項時 key 不會被當成 C 選項",
   p[0].key === "A" && p[0].q.c === undefined && p[0].q.b === "乙", JSON.stringify(p[0].q));

p = parseBulkQuestions("  T1|甲|乙|A  \n\n T2|丙|丁|b|團隊領航員 \n");
ok("多行＋空行＋小寫正解", p.length === 2 && p[1].key === "B" && p[1].q.cat === "team", JSON.stringify(p.map(x=>x.key)));

p = parseBulkQuestions("題幹|甲|乙|丙|丁|A|team");
ok("類別也可以用 id 寫", p[0].q.cat === "team");

throws("欄位不夠", "題幹|甲|A", "欄位不夠");
throws("類別打錯字", "題幹|甲|乙|A|情緒大師", "看不懂最後一欄");
throws("正解指向空選項", "題幹|甲|乙||D", "沒有填");
throws("題幹空白", "|甲|乙|A", "不能空白");
throws("全空", "   \n  ", "沒有讀到");

const failed = log.filter(l => l.startsWith("FAIL")).length;
document.querySelector("#out").textContent =
  log.join("\n") + `\n\n${log.length - failed} passed, ${failed} failed`;
</script></body></html>
