<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><title>logic test</title>
<style>body{font-family:ui-monospace,monospace;background:#00043f;color:#dbe6ff;padding:18px;font-size:13px}
b{color:#ffd24a}.f{color:#ff8497}</style></head>
<body><pre id="out">running…</pre>
<script type="module">
import {
  buildScoreboard, categoryMatrix, categoryChampions, groupBestCategories, columnWinners,
  scoreOne, tallyMembers, tallyAllMembers, tallyReps, categoryOf, parseBulkQuestions,
  questionsOf, listOf, gridColumns, secondsLeft, ptsOf, LISTS,
  blocksOf, normalizeBlock, groupBlocks, videoEmbed, isSoloMedia, webpSrc
} from "./assets/js/common.js";

const log = [];
const ok = (name, cond, extra = "") =>
  log.push(`${cond ? "PASS" : "<b class='f'>FAIL</b>"}  ${name}${extra ? "   " + extra : ""}`);

// ════════ 佈景 ════════
//  3 組。q1/q2 正式題（人際），q3 正式題（情緒），q4 正式題未公布，q5 是 DEMO。
const groups = { g1:{name:"第 1 組",order:0}, g2:{name:"第 2 組",order:1}, g3:{name:"第 3 組",order:2} };
const questions = {
  q1:{order:0,text:"T1",a:"a",b:"b",cat:"social", list:"main"},
  q2:{order:1,text:"T2",a:"a",b:"b",cat:"social", list:"main"},
  q3:{order:2,text:"T3",a:"a",b:"b",cat:"emotion",list:"main",pts:3},   // 加權題
  q4:{order:3,text:"T4",a:"a",b:"b",cat:"emotion",list:"main"},   // 未公布
  q5:{order:0,text:"D1",a:"a",b:"b",cat:"social", list:"demo"}
};
const keys = { q1:"A", q2:"A", q3:"A", q4:"A", q5:"A" };
const revealed = { q1:true, q2:true, q3:true, q5:true };          // q4 沒公布

// 代表答案
const repAnswers = {
  q1:{ g1:{c:"A"}, g2:{c:"A"}, g3:{c:"B"} },        // g1✔ g2✔ g3✘
  q2:{ g1:{c:"A"}, g2:{c:"B"}            },        // g1✔ g2✘ g3 沒答
  q3:{ g1:{c:"B"}, g2:{c:"A"}, g3:{c:"A"} },       // g1✘ g2✔ g3✔
  q4:{ g1:{c:"A"}, g2:{c:"A"}, g3:{c:"A"} },       // 未公布，不算
  q5:{ g1:{c:"A"}                        }         // DEMO，不算
};
// 台下學員（/responses/{qid}/{gid}/{uid}）
const responses = {
  q1:{ g1:{u1:{c:"A"},u2:{c:"A"},u3:{c:"B"}},      // 2/3 = 67% ≥50% ✔
       g2:{u4:{c:"A"},u5:{c:"B"}},                  // 1/2 = 50% ≥50% ✔（剛好過半要算）
       g3:{u6:{c:"B"},u7:{c:"B"},u8:{c:"A"}} },     // 1/3 = 33% ✘
  q2:{ g1:{u1:{c:"B"},u2:{c:"B"}} },                // 0/2 ✘ ；g2/g3 沒人答
  q3:{ g2:{u4:{c:"A"}} },                           // 1/1 ✔
  q4:{ g1:{u1:{c:"A"}} },                           // 未公布，不算
  q5:{ g1:{u1:{c:"A"}} }                            // DEMO，不算
};

// ════════ 1. 單題計分 ════════
let s = scoreOne("A", {c:"A"}, {u1:{c:"A"},u2:{c:"B"}});
ok("代表對 + 學員剛好 50% → 2 分", s.points === 2 && s.repOk && s.memberOk, JSON.stringify({r:s.memberRate,p:s.points}));

s = scoreOne("A", {c:"B"}, {u1:{c:"A"},u2:{c:"A"},u3:{c:"B"}});
ok("代表錯 + 學員 67% → 1 分", s.points === 1 && !s.repOk && s.memberOk, "rate=" + s.memberRate);

s = scoreOne("A", {c:"A"}, {u1:{c:"B"},u2:{c:"B"},u3:{c:"A"}});
ok("代表對 + 學員 33% → 1 分", s.points === 1 && s.repOk && !s.memberOk, "rate=" + s.memberRate);

s = scoreOne("A", null, null);
ok("代表沒答 + 沒學員 → 0 分", s.points === 0 && s.repChoice === null && s.memberRate === null);

// 這一條是規則的重點：兩筆分數互不影響
s = scoreOne("A", null, {u1:{c:"A"},u2:{c:"A"},u3:{c:"B"}});
ok("代表沒送出，學員 67% 過半 → 照樣 +1",
   s.points === 1 && s.repChoice === null && s.memberOk === true, JSON.stringify({p:s.points,rate:s.memberRate}));

s = scoreOne("A", null, {u1:{c:"A"},u2:{c:"B"}}, 4);
ok("代表沒送出 + 加權 4 分題，學員剛好 50% → +4",
   s.points === 4 && s.repOk === false, JSON.stringify({p:s.points}));

s = scoreOne("A", {c:"B"}, {u1:{c:"A"},u2:{c:"A"}});
ok("代表送錯也不影響學員那一分", s.points === 1 && !s.repOk && s.memberOk);

s = scoreOne("A", {c:"A"}, null);
ok("學員一個都沒答不給加分", s.points === 1 && s.memberOk === false, "rate=" + JSON.stringify(s.memberRate));

s = scoreOne("A", {c:"X"}, {u1:{c:"?"}});
ok("非法字母一律忽略", s.repChoice === null && s.memberTally.total === 0);

// ════════ 2. 題庫 ════════
ok("正式題 4 題", questionsOf(questions, LISTS.MAIN).length === 4);
ok("DEMO 1 題",  questionsOf(questions, LISTS.DEMO).length === 1);
ok("沒寫 list 當成正式題", listOf({text:"x"}) === LISTS.MAIN);

// ════════ 3. 總分 ════════
const board = buildScoreboard(groups, questions, keys, responses, repAnswers, revealed, LISTS.MAIN);
const by = Object.fromEntries(board.rows.map(r => [r.gid, r]));

ok("只算已公布的正式題 → 3 題", board.questionCount === 3);
ok("滿分 = 各題配分 × 2（1+1+3 → 10）", by.g1.max === 10, String(by.g1.max));

//  g1：q1 代表✔+學員✔=2、q2 代表✔+學員✘=1、q3(配分3) 代表✘+學員無=0  → 3
ok("g1 = 3 分", by.g1.points === 3, JSON.stringify({p:by.g1.points, rep:by.g1.repCorrect, mem:by.g1.memberBonus}));
//  g2：q1 ✔+✔=2、q2 ✘+無=0、q3(配分3) ✔+✔=6  → 8
ok("g2 = 8 分（加權題全對拿 6）", by.g2.points === 8, JSON.stringify({p:by.g2.points, rep:by.g2.repCorrect, mem:by.g2.memberBonus}));
//  g3：q1 ✘+✘=0、q2 沒答=0、q3(配分3) ✔+無=3  → 3
ok("g3 = 3 分（加權題只有代表答對）", by.g3.points === 3, JSON.stringify({p:by.g3.points, rep:by.g3.repCorrect, mem:by.g3.memberBonus}));

ok("代表答對次數",   by.g1.repCorrect === 2 && by.g2.repCorrect === 2 && by.g3.repCorrect === 1);
ok("學員過半次數",   by.g1.memberBonus === 1 && by.g2.memberBonus === 2 && by.g3.memberBonus === 0);
ok("代表作答題數（g3 少一題）", by.g3.repAnswered === 2, String(by.g3.repAnswered));
ok("排序：g2 > g1 = g3（同分時比代表答對數）",
   board.rows.map(r => r.gid).join(",") === "g2,g1,g3", board.rows.map(r=>r.gid+":"+r.points).join(" "));

const demo = buildScoreboard(groups, questions, keys, responses, repAnswers, revealed, LISTS.DEMO);
ok("DEMO 分開計，不混進正式分", demo.questionCount === 1 && demo.rows.every(r => r.max === 2));

// ════════ 3b. 配分 ════════
ok("沒設定 → 1 分",     ptsOf({}) === 1 && ptsOf(undefined) === 1);
ok("設定 5 → 5 分",     ptsOf({pts:5}) === 5);
ok("0 / 負數 / 文字都退回 1", ptsOf({pts:0}) === 1 && ptsOf({pts:-3}) === 1 && ptsOf({pts:"abc"}) === 1);
ok("超過 99 退回 1",    ptsOf({pts:150}) === 1);
ok("小數會四捨五入",     ptsOf({pts:2.4}) === 2 && ptsOf({pts:2.6}) === 3);

let w = scoreOne("A", {c:"A"}, {u1:{c:"A"},u2:{c:"A"}}, 3);
ok("配分 3：全對 → 6 分", w.points === 6 && w.pts === 3, JSON.stringify({p:w.points}));
w = scoreOne("A", {c:"B"}, {u1:{c:"A"},u2:{c:"A"}}, 3);
ok("配分 3：只有學員過半 → 3 分", w.points === 3);

// ════════ 3c. 轉盤加倍 ════════
//  q1 讓 g3 加倍：g3 在 q1 是 代表✘ + 學員33%✘ → 還是 0 分，但滿分要變大
const dbl1 = buildScoreboard(groups, questions, keys, responses, repAnswers, revealed, LISTS.MAIN, { q1: "g3" });
const d1 = Object.fromEntries(dbl1.rows.map(r => [r.gid, r]));
ok("加倍組的滿分變大（g3 10 → 12）", d1.g3.max === 12, String(d1.g3.max));
ok("沒被加倍的組滿分不變", d1.g1.max === 10 && d1.g2.max === 10, d1.g1.max + "/" + d1.g2.max);
ok("加倍但答錯，分數不變（3）", d1.g3.points === 3, String(d1.g3.points));

//  q1 讓 g1 加倍：g1 在 q1 是 代表✔ + 學員67%✔ = 2 分 → 變 4 分，總分 3 → 5
const dbl2 = buildScoreboard(groups, questions, keys, responses, repAnswers, revealed, LISTS.MAIN, { q1: "g1" });
const d2 = Object.fromEntries(dbl2.rows.map(r => [r.gid, r]));
ok("加倍且全對 → 該題 2 分變 4 分（總分 3→5）", d2.g1.points === 5, String(d2.g1.points));
ok("加倍只影響被抽中的那一組", d2.g2.points === 8 && d2.g3.points === 3,
   d2.g2.points + "/" + d2.g3.points);

//  加權題（q3 配分 3）再加倍 → 該題等於配分 6
const dbl3 = buildScoreboard(groups, questions, keys, responses, repAnswers, revealed, LISTS.MAIN, { q3: "g2" });
const d3 = Object.fromEntries(dbl3.rows.map(r => [r.gid, r]));
ok("加權題再加倍：g2 的 q3 從 6 分變 12（總分 8→14）", d3.g2.points === 14, String(d3.g2.points));
ok("加權題加倍後滿分 10 → 16", d3.g2.max === 16, String(d3.g2.max));

ok("沒傳 doubles 時行為不變",
   JSON.stringify(buildScoreboard(groups,questions,keys,responses,repAnswers,revealed,LISTS.MAIN).rows.map(r=>r.points))
   === JSON.stringify(board.rows.map(r=>r.points)));
ok("doubles 指向不存在的題目不會出事",
   buildScoreboard(groups,questions,keys,responses,repAnswers,revealed,LISTS.MAIN,{qZZ:"g1"}).rows[0].points === 8);

// ════════ 4. 類別矩陣 ════════
const mx = categoryMatrix(board);
ok("只出現有公布題目的類別", mx.cats.map(c=>c.id).join(",") === "social,emotion", mx.cats.map(c=>c.id).join(","));

const cell = (gid, catId) => {
  const r = mx.rows.find(r => r.gid === gid);
  return r.cells[mx.cats.findIndex(c => c.id === catId)];
};
ok("g1 人際 3/4", cell("g1","social").points === 3 && cell("g1","social").max === 4, JSON.stringify(cell("g1","social")));
ok("g1 情緒 0/6（加權題滿分是 6）", cell("g1","emotion").points === 0 && cell("g1","emotion").max === 6,
   JSON.stringify(cell("g1","emotion")));
ok("g2 情緒 6/6 = 100%", cell("g2","emotion").rate === 100, JSON.stringify(cell("g2","emotion")));
ok("g3 情緒 3/6 = 50%",  cell("g3","emotion").rate === 50,  JSON.stringify(cell("g3","emotion")));
ok("g3 人際 0/4 = 0%",  cell("g3","social").rate === 0);

const champs = Object.fromEntries(categoryChampions(mx).map(c => [c.cat.id, c.best]));
ok("人際冠軍 g1（3/4）", champs.social?.gid === "g1", JSON.stringify(champs.social));
ok("情緒冠軍 g2（6/6）", champs.emotion?.gid === "g2", JSON.stringify(champs.emotion));

const best = Object.fromEntries(groupBestCategories(mx).map(b => [b.gid, b]));
ok("g1 最強 = 人際",  best.g1.cat?.id === "social",  best.g1.cat?.id);
ok("g2 最強 = 情緒",  best.g2.cat?.id === "emotion", best.g2.cat?.id);

const wins = columnWinners(mx);
ok("columnWinners 指向正確列", mx.rows[wins[0]].gid === "g1" && mx.rows[wins[1]].gid === "g2", JSON.stringify(wins));

const emptyBoard = buildScoreboard(groups, questions, keys, {}, {}, {}, LISTS.MAIN);
ok("完全沒公布 → 沒有類別、全 0 分",
   categoryMatrix(emptyBoard).cats.length === 0 && emptyBoard.rows.every(r => r.points === 0));

// ════════ 5. 分布統計 ════════
const t1 = tallyMembers(responses.q1.g1);
ok("tallyMembers 單組分布", t1.A === 2 && t1.B === 1 && t1.total === 3, JSON.stringify(t1));
const tm = tallyAllMembers(responses.q1);
ok("tallyAllMembers 跨組加總", tm.total === 8 && tm.A === 4 && tm.B === 4, JSON.stringify(tm));
const tr = tallyReps(repAnswers.q1);
ok("tallyReps", tr.total === 3 && tr.A === 2 && tr.B === 1, JSON.stringify(tr));

// ════════ 6. 投影格子欄數 ════════
ok("6 組 → 3 欄",  gridColumns(6)  === 3,  String(gridColumns(6)));
ok("8 組 → 4 欄",  gridColumns(8)  === 4,  String(gridColumns(8)));
ok("12 組 → 4 欄", gridColumns(12) === 4,  String(gridColumns(12)));
ok("1 組 → 1 欄",  gridColumns(1)  === 1);
ok("每組都有格子（不會漏）",
   [1,2,3,5,7,8,9,10,11,12,13,16,20].every(n => gridColumns(n) * Math.ceil(n / gridColumns(n)) >= n));

// ════════ 7. 倒數 ════════
const now = Date.now();
ok("剛開始 → 60",       secondsLeft(now, 60, 0) === 60, String(secondsLeft(now,60,0)));
ok("過了 30 秒 → 30",   secondsLeft(now - 30000, 60, 0) === 30, String(secondsLeft(now-30000,60,0)));
ok("超時不會變負數",     secondsLeft(now - 90000, 60, 0) === 0);
ok("沒有 openedAt → null", secondsLeft(null, 60, 0) === null);
ok("伺服器時鐘差有被算進去", secondsLeft(now, 60, 10000) === 50, String(secondsLeft(now,60,10000)));

// ════════ 8. 批次匯入 ════════
const throws = (name, raw, hint) => {
  try { parseBulkQuestions(raw); ok(name + "（應該要報錯）", false); }
  catch (e) { ok(name, hint ? e.message.includes(hint) : true, e.message.slice(0, 40)); }
};
let p = parseBulkQuestions("題幹|甲|乙|丙|丁|C|情緒管理大師");
ok("四選項＋類別", p[0].key === "C" && p[0].q.cat === "emotion" && p[0].q.c === "丙", JSON.stringify(p[0].q));
p = parseBulkQuestions("題幹|甲|乙|A");
ok("只有 AB 時 key 不會被當成 C 選項", p[0].key === "A" && p[0].q.c === undefined);
p = parseBulkQuestions(" T1|甲|乙|A \n\n T2|丙|丁|b|團隊領航員 \n");
ok("多行＋空行＋小寫正解", p.length === 2 && p[1].key === "B" && p[1].q.cat === "team");
throws("欄位不夠", "題幹|甲|A", "欄位不夠");
throws("類別打錯字", "題幹|甲|乙|A|情緒大師", "看不懂最後一欄");
throws("正解指向空選項", "題幹|甲|乙||D", "沒有填");
throws("全空", "   \n  ", "沒有讀到");

// ════════ 8b. 說明排版區塊 ════════
let nb = normalizeBlock({});
ok("空區塊會補上預設值", nb.t === "text" && nb.w === "full" && nb.size === 3 && nb.align === "left",
   JSON.stringify(nb));
nb = normalizeBlock({ t: "img", v: "u", w: "half", size: 5, align: "center" });
ok("完整區塊原樣保留", nb.t === "img" && nb.w === "half" && nb.size === 5 && nb.align === "center");
ok("不合法的型別退回文字", normalizeBlock({ t: "audio" }).t === "text");
ok("不合法的寬度退回整行", normalizeBlock({ w: "third" }).w === "full");
ok("超出範圍的大小退回 3",
   normalizeBlock({ size: 9 }).size === 3 && normalizeBlock({ size: 0 }).size === 3
   && normalizeBlock({ size: "x" }).size === 3);

const B = [{ t:"head", v:"標題" }, { t:"text", v:"內文" }, { t:"img", v:"u.png" }];
ok("陣列型 blocks 讀得到", blocksOf({ blocks: B }).length === 3);
ok("Firebase 物件型 blocks 也讀得到（且順序正確）",
   blocksOf({ blocks: { "0":B[0], "1":B[1], "2":B[2] } }).map(b => b.t).join(",") === "head,text,img");
ok("鍵值亂序時依數字排",
   blocksOf({ blocks: { "2":B[2], "0":B[0], "1":B[1] } }).map(b => b.t).join(",") === "head,text,img");
ok("空內容的區塊會被濾掉",
   blocksOf({ blocks: [{ t:"text", v:"" }, { t:"text", v:"  " }, { t:"text", v:"有" }] }).length === 1);

ok("沒有 blocks 也沒有舊欄位 → 空陣列", blocksOf({}).length === 0);
const legacy = blocksOf({ exText: "說明", exImg: "i.png" });
ok("舊的 exText+exImg 自動轉成兩個半行區塊",
   legacy.length === 2 && legacy[0].t === "text" && legacy[0].w === "half"
   && legacy[1].t === "img" && legacy[1].w === "half", JSON.stringify(legacy.map(b => b.t + ":" + b.w)));
const onlyText = blocksOf({ exText: "只有文字" });
ok("只有舊文字 → 一個整行文字區塊",
   onlyText.length === 1 && onlyText[0].w === "full", JSON.stringify(onlyText));
ok("有 blocks 時就不看舊欄位",
   blocksOf({ blocks: [{ t:"head", v:"新" }], exText: "舊", exImg: "i.png" }).length === 1);

// ---- 8c. 靠右 ＋ 自動寬（緊貼並排） ----
ok("靠右是合法的對齊", normalizeBlock({ align: "right" }).align === "right");
ok("不合法的對齊退回靠左", normalizeBlock({ align: "top" }).align === "left");
ok("自動寬是合法的寬度", normalizeBlock({ w: "auto" }).w === "auto");

const N = a => a.map(normalizeBlock);
let R = groupBlocks(N([{ t:"img", v:"a", w:"auto" }, { t:"img", v:"b", w:"auto" }]));
ok("連續兩個自動寬收成同一列（A B 靠在一起）",
   R.length === 1 && R[0].auto && R[0].items.length === 2, JSON.stringify(R.map(r => r.items.length)));

R = groupBlocks(N([{ t:"img", v:"a", w:"auto" }, { t:"text", v:"c", w:"full" },
                   { t:"img", v:"b", w:"auto" }]));
ok("中間夾了整行區塊就會斷開成三列",
   R.length === 3 && R[0].auto && !R[1].auto && R[2].auto, JSON.stringify(R.map(r => r.auto)));

R = groupBlocks(N([{ t:"img", v:"a", w:"auto", align:"right" },
                   { t:"img", v:"b", w:"auto", align:"left" }]));
ok("整列的對齊取第一個區塊的", R[0].align === "right", R[0].align);

R = groupBlocks(N([{ t:"text", v:"a", w:"half" }, { t:"text", v:"b", w:"half" }]));
ok("半行區塊各自成列（維持原本的 49% 並排）",
   R.length === 2 && !R[0].auto && !R[1].auto);

ok("沒有區塊時分列結果是空的", groupBlocks([]).length === 0);
// ---- 8d. 影片區塊 ----
ok("影片是合法的型別", normalizeBlock({ t: "video" }).t === "video");
const VE = u => videoEmbed(u);
ok("YouTube watch 轉成內嵌網址",
   VE("https://www.youtube.com/watch?v=dQw4w9WgXcQ").src === "https://www.youtube.com/embed/dQw4w9WgXcQ?rel=0");
ok("youtu.be 短網址也認得", VE("https://youtu.be/abc123XYZ").src.endsWith("/embed/abc123XYZ?rel=0"));
ok("shorts 也認得", VE("https://www.youtube.com/shorts/Zz9_-9xK1aQ").src.endsWith("/embed/Zz9_-9xK1aQ?rel=0"));
ok("v= 不在第一個參數也抓得到",
   VE("https://youtube.com/watch?list=PL1&v=kJQP7kiw5Fk").src.endsWith("/embed/kJQP7kiw5Fk?rel=0"),
   VE("https://youtube.com/watch?list=PL1&v=kJQP7kiw5Fk").src);
ok("Vimeo 轉成內嵌網址", VE("https://vimeo.com/123456789").src === "https://player.vimeo.com/video/123456789");
ok("mp4 檔案原樣當成檔案播放",
   VE("assets/video/x.mp4").kind === "file" && VE("assets/video/x.mp4").src === "assets/video/x.mp4");
ok("空網址不會爆", VE("").kind === "file" && VE("").src === "");
ok("非影片網站當成檔案", VE("https://example.com/a.webm").kind === "file");

// ---- 8d2. 圖片路徑先試 webp ----
ok("站內 png 換成 webp", webpSrc("assets/img/explain/a.png") === "assets/img/explain/a.webp");
ok("站內 jpg 換成 webp", webpSrc("assets/img/hero.jpg") === "assets/img/hero.webp");
ok("jpeg 也換", webpSrc("x/y.JPEG") === "x/y.webp");
ok("已經是 webp 就不動", webpSrc("a/b.webp") === "a/b.webp");
ok("外部 http 網址不動", webpSrc("https://example.com/a.png") === "https://example.com/a.png");
ok("外部 // 網址不動", webpSrc("//cdn.example.com/a.jpg") === "//cdn.example.com/a.jpg");
ok("data URI 不動", webpSrc("data:image/png;base64,AAA") === "data:image/png;base64,AAA");
ok("檔名中間有 .png 不會被誤換", webpSrc("img/a.png.backup.jpg") === "img/a.png.backup.webp");
ok("空字串安全", webpSrc("") === "" && webpSrc(null) === "" && webpSrc(undefined) === "");
ok("非圖片副檔名不動", webpSrc("assets/video/a.mp4") === "assets/video/a.mp4");

// ---- 8e. 只有一張圖／一段影片 → 佔滿說明區 ----
const NB = a => a.map(normalizeBlock);
ok("只有一張圖 → 佔滿", isSoloMedia(NB([{ t:"img", v:"a.png" }])));
ok("只有一段影片 → 佔滿", isSoloMedia(NB([{ t:"video", v:"https://youtu.be/abc123" }])));
ok("圖片配文字 → 不佔滿", !isSoloMedia(NB([{ t:"img", v:"a.png" }, { t:"text", v:"說明" }])));
ok("兩張圖 → 不佔滿", !isSoloMedia(NB([{ t:"img", v:"a.png" }, { t:"img", v:"b.png" }])));
ok("只有一段文字 → 不佔滿", !isSoloMedia(NB([{ t:"text", v:"只有字" }])));
ok("沒有區塊 → 不佔滿", !isSoloMedia([]));

ok("分列不會漏掉或多出區塊", (() => {
  const src = N([{t:"img",v:"1",w:"auto"},{t:"img",v:"2",w:"auto"},{t:"text",v:"3"},
                 {t:"img",v:"4",w:"auto"},{t:"text",v:"5",w:"half"}]);
  const flat = groupBlocks(src).flatMap(r => r.items);
  return flat.length === src.length && flat.map(b => b.v).join("") === "12345";
})());

// ════════ 9. 類別工具 ════════
ok("未知類別 → 未分類", categoryOf("nope").id === "uncat");
ok("undefined → 未分類", categoryOf(undefined).name === "未分類");

const failed = log.filter(l => l.includes("FAIL")).length;
document.querySelector("#out").innerHTML =
  log.join("\n") + `\n\n<b>${log.length - failed} passed, ${failed} failed</b>`;
</script></body></html>
