<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>投影統計｜大學星攻略</title>
<link rel="icon" href="assets/img/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  /* 投影用：固定 16:9。字級整體比之前放大一級，最後一排也看得清楚。 */
  html, body { height: 100%; overflow: hidden; }

  .stage {
    position: relative;
    width: 100vw; height: 100vh;
    display: flex; flex-direction: column;
    padding: 2.4vh 2.6vw;
    font-size: 2.1vh;
  }
  .stage .logo { width: 21vh; margin: 0;
    -webkit-mask-image: radial-gradient(ellipse 62% 62% at 50% 50%, #000 58%, transparent 100%);
            mask-image: radial-gradient(ellipse 62% 62% at 50% 50%, #000 58%, transparent 100%); }

  .top { display: flex; align-items: center; justify-content: space-between; gap: 2vw; flex: 0 0 auto; }
  .top .qbadge { font-size: 3.2vh; padding: 1.2vh 2.2vw; }
  .top .qbadge b { font-size: 4.2vh; }
  .top .cat-pill { font-size: 2.7vh; padding: 1vh 1.8vw; }

  /* 配分徽章：只有不是 +1 的題目才會出現 */
  .pts-badge {
    display: inline-flex; align-items: center;
    font-size: 3.2vh; font-weight: 900; line-height: 1;
    padding: 1vh 1.8vw;
    color: #4a2c00;
    border-radius: 999px;
    background: linear-gradient(180deg, #fff2b8, var(--gold) 55%, #dc9400);
    box-shadow: 0 0 2.4vh rgba(255,200,31,.75);
    animation: pts-pop .5s cubic-bezier(.2,1.6,.4,1);
  }
  @keyframes pts-pop { from { transform: scale(.6); } to { transform: scale(1); } }

  .body { flex: 1 1 auto; display: flex; flex-direction: column; justify-content: center; gap: 2vh; min-height: 0; }

  /* 六大主題那一頁：整張圖鋪滿投影畫面，連頂部列與頁尾都收起來 */
  .stage.bleed { padding: 0; }
  .stage.bleed .top,
  .stage.bleed .foot { display: none; }
  .stage.bleed .body { gap: 0; }
  .bleed-img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }

  .foot { display: flex; align-items: center; justify-content: space-between; gap: 2vw;
          color: var(--txt-dim); font-size: 2vh; flex: 0 0 auto; }
  .foot b { color: var(--gold); }
  #s-tip { flex: 1 1 auto; text-align: center; color: var(--gold-lt); }

  /* ---------- 題幹 ---------- */
  .big-q {
    text-align: center;
    font-size: 4.6vh; font-weight: 900; line-height: 1.3;
    color: #08205c;
    background: linear-gradient(180deg, #fff, #e6efff);
    border: .45vh solid var(--cyan);
    box-shadow: 0 0 4vh rgba(53,168,255,.7);
    padding: 2.6vh 2.6vw;
    clip-path: polygon(2.6vh 0, 100% 0, 100% calc(100% - 2.6vh), calc(100% - 2.6vh) 100%, 0 100%, 0 2.6vh);
  }
  /* 出題畫面：題目在上、各組格子在下。
     題目區塊有高度上限，剩下的都留給格子 —— 組數多的時候才不會擠成一團。 */
  /* overflow 不能放在 qblock 上 —— 倒數圓框的外框與光暈會被切掉。
     改成只裁切題目那一欄，圓框則留一點右邊距讓光暈畫得出來。 */
  .qblock {
    flex: 0 0 auto;
    display: flex; gap: 2.4vw; align-items: center;
    max-height: 44vh;
  }
  .qblock > div:first-child { overflow: hidden; }
  .qblock .countdown { margin-right: 1.4vw; }
  .qblock .big-q { padding: 2vh 2vw; }
  .opt-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2vh 2vw; margin-top: 1.4vh; }
  .opt-mini {
    display: flex; align-items: center; gap: 1vw; overflow: hidden;
    padding: .5vh .8vw;
    border-radius: .9vh;
    border: .25vh solid rgba(53,168,255,.4);
    background: linear-gradient(180deg, rgba(23,58,175,.55), rgba(8,24,105,.7));
  }
  .opt-mini .k {
    flex: 0 0 auto; width: 6vh; height: 6.6vh; display: grid; place-items: center;
    font-size: 3.8vh; font-weight: 900; color: #6b3b00;
    background: linear-gradient(180deg, #fff2b8, var(--gold) 50%, #e09a00);
    clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
    text-shadow: 0 1px 0 rgba(255,255,255,.5);
  }
  .opt-mini .t {
    flex: 1 1 auto; min-width: 0; overflow: hidden;
    font-size: 3vh; font-weight: 700; line-height: 1.22; color: #dce9ff;
  }

  /* ---------- 倒數計時 ---------- */
  .countdown {
    position: relative; flex: 0 0 auto;
    width: 17vh; height: 17vh;
    display: grid; place-items: center;
    border-radius: 50%;
    font-size: 8.8vh; font-weight: 900; line-height: 1;
    font-variant-numeric: tabular-nums;
    color: var(--cyan-lt);
    background: radial-gradient(circle at 50% 45%, rgba(20,50,160,.9), rgba(2,8,44,.95));
    box-shadow: 0 0 0 .5vh var(--cyan), 0 0 5vh rgba(53,168,255,.7), inset 0 0 4vh rgba(53,168,255,.35);
  }
  .countdown.warn {
    color: var(--gold-lt);
    box-shadow: 0 0 0 .5vh var(--gold), 0 0 6vh rgba(255,200,31,.8), inset 0 0 4vh rgba(255,200,31,.35);
  }
  .countdown.danger {
    color: #ffd3db;
    box-shadow: 0 0 0 .6vh var(--bad), 0 0 8vh rgba(255,84,112,.95), inset 0 0 5vh rgba(255,84,112,.4);
    animation: cd-throb .55s ease-in-out infinite;
  }
  @keyframes cd-throb { 0%,100% { transform: scale(1); } 50% { transform: scale(1.09); } }

  .stage.shake { animation: shake .28s linear infinite; }
  @keyframes shake {
    0%,100% { transform: translate(0,0); }
    25%     { transform: translate(.28vh,-.2vh); }
    50%     { transform: translate(-.24vh,.24vh); }
    75%     { transform: translate(.2vh,.16vh); }
  }

  .sweep { position: absolute; inset: 0; pointer-events: none; overflow: hidden; opacity: 0; transition: opacity .4s ease; }
  .stage.tense .sweep { opacity: 1; }
  .sweep::before {
    content: ""; position: absolute; top: -20%; left: -30%;
    width: 30%; height: 140%;
    background: linear-gradient(90deg, transparent, rgba(120,190,255,.16), transparent);
    transform: rotate(9deg);
    animation: sweep 2.6s linear infinite;
  }
  @keyframes sweep { to { left: 130%; } }

  /* ---------- 各組代表答案格 ---------- */
  .grid { display: grid; gap: 1.1vh 1vw; flex: 1 1 auto; min-height: 0; align-content: stretch; }
  /* 橫式：左邊寫哪一組、右邊是答案。
     公布答案時改成三欄（組名 / 答案置中 / 勾叉靠右），三個東西才不會擠在一起。 */
  .cellbox {
    position: relative;
    display: grid; grid-template-columns: 1fr auto auto;
    align-items: center;
    gap: .6vw; padding: 0 .9vw;
    border-radius: 1vh;
    border: .28vh solid rgba(53,168,255,.4);
    background: linear-gradient(180deg, rgba(8,22,96,.75), rgba(2,8,48,.8));
    overflow: hidden;
    transition: box-shadow .3s ease, border-color .3s ease, background .3s ease;
  }
  /* 公布時三欄等分才能讓答案真的置中，但這樣組名那欄會變窄，
     所以公布時組名縮一點 —— 這個畫面本來就是答案為主。 */
  .cellbox.revealed { grid-template-columns: 1fr auto 1fr; }
  .cellbox.revealed .mark { justify-self: end; }
  .cellbox.revealed .gname { font-size: var(--cell-name-rev, calc(var(--cell-name, 2.4vh) * .74)); }

  .cellbox .gname {
    min-width: 0; text-align: left;
    font-size: var(--cell-name, 2.4vh); font-weight: 800; color: #b8cdf5;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .cellbox .glet {
    font-size: var(--cell-let, 6vh); font-weight: 900; line-height: 1; color: #33477e;
  }
  /* 「還沒送出」的省略號要窄 —— 原本用 .2em 字距，寬度是字母的三倍，
     會把左邊的組名擠到被 ellipsis 切掉 */
  .cellbox .waiting {
    font-size: calc(var(--cell-name, 2.4vh) * .85);
    color: #4a5a8c; font-weight: 700; letter-spacing: .04em;
  }

  .cellbox.done {
    border-color: var(--gold);
    background: linear-gradient(180deg, rgba(70,52,6,.85), rgba(28,20,2,.9));
    box-shadow: 0 0 2.4vh rgba(255,200,31,.55), inset 0 0 2vh rgba(255,200,31,.18);
    animation: cell-pop .45s cubic-bezier(.2,1.6,.4,1);
  }
  .cellbox.done .glet {
    background: linear-gradient(180deg, #fff6cf, var(--gold) 45%, #cf8b00);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 1.4vh rgba(255,200,31,.8));
  }
  .cellbox.done .gname { color: var(--gold-lt); }
  @keyframes cell-pop { from { transform: scale(.86); } to { transform: scale(1); } }

  .cellbox.right { border-color: var(--ok);  box-shadow: 0 0 2.6vh rgba(47,217,107,.6); }
  .cellbox.right .glet { background: linear-gradient(180deg,#d6ffe6,#2fd96b 50%,#0f8a3d);
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .cellbox.right  .gname { color: #9dffc4; }
  .cellbox.wrongc { border-color: rgba(255,84,112,.55); opacity: .62; }
  .cellbox.wrongc .glet { color: #ff8497; background: none; -webkit-text-fill-color: #ff8497; }
  /* ✅/❌ 靠右自成一欄。空的時候寬度為 0，不會佔掉組名的空間 */
  .cellbox .mark {
    font-size: calc(var(--cell-name, 2.4vh) * .8);
    line-height: 1; white-space: nowrap;
  }
  .cellbox .mark:empty { display: none; }

  /* ---------- 公布答案 ---------- */
  .reveal-top { display: flex; gap: 2vw; align-items: stretch; flex: 1 1 auto; min-height: 0; }
  .reveal-ans { flex: 0 0 21%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .reveal-ans .reveal-letter { font-size: 20vh; }
  .reveal-ex {
    flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column;
    border-left: .28vh solid rgba(255,200,31,.35); padding-left: 2vw;
  }

  .explain { display: flex; gap: 2vw; align-items: stretch; min-height: 0; flex: 1 1 auto; }
  .explain .txt {
    flex: 1 1 auto; min-width: 0; overflow: hidden;
    font-size: var(--ex-fs, 3vh); line-height: 1.5; color: #e6eeff; white-space: pre-wrap;
  }
  /* grid 的軌道要用 minmax(0, 1fr) 夾住，否則軌道會被圖片撐高，
     img 的 max-height:100% 就失去參考對象，圖會被切掉 */
  .explain .pic {
    flex: 0 0 38%; min-width: 0;
    display: grid; grid-template-rows: minmax(0, 1fr); grid-template-columns: minmax(0, 1fr);
    place-items: center;
  }
  .explain .pic img {
    max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 1.2vh;
    box-shadow: 0 0 0 .3vh rgba(255,200,31,.4), 0 1.4vh 4vh rgba(0,0,0,.6);
  }
  .explain.noimg .pic { display: none; }

  /* ---------- 補充大圖 ---------- */
  .fullimg {
    flex: 1 1 auto; min-height: 0;
    display: grid; grid-template-rows: minmax(0, 1fr); grid-template-columns: minmax(0, 1fr);
    place-items: center;
  }
  .fullimg img {
    max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 1vh;
    box-shadow: 0 0 0 .3vh rgba(255,200,31,.4), 0 2vh 5vh rgba(0,0,0,.65);
  }

  /* ---------- 統計條 ---------- */
  .screen-bars { display: grid; gap: 1.5vh; }
  .screen-bars .bar-key   { width: 6.4vh; height: 7vh; font-size: 3.6vh; }
  .screen-bars .bar-track { height: 6vh; border-radius: 1vh; }
  .screen-bars .bar-num   { min-width: 16vw; font-size: 3vh; }
  .screen-bars .bar-opt   { flex: 0 0 24vw; font-size: 2.7vh; font-weight: 700; color: #d8e6ff;
                            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ---------- 排行榜表格 ---------- */
  table.rank.rank-screen { width: 100%; --rfs: 3.6vh; }
  table.rank.rank-screen th { font-size: calc(var(--rfs) * .62); padding: calc(var(--rfs) * .3) .8vw; }
  table.rank.rank-screen td { font-size: var(--rfs); padding: calc(var(--rfs) * .4) .8vw; line-height: 1.22; }
  table.rank.rank-screen tr.top1 td { font-size: calc(var(--rfs) * 1.22); }

  /* ---------- 類別矩陣 ---------- */
  table.matrix.matrix-screen { --mfs: 2.6vh; }
  table.matrix.matrix-screen th,
  table.matrix.matrix-screen td { padding: calc(var(--mfs) * .32) .5vw; font-size: var(--mfs); line-height: 1.18; }
  table.matrix.matrix-screen thead th { font-size: calc(var(--mfs) * .8); }
  table.matrix.matrix-screen td small { font-size: calc(var(--mfs) * .56); }

  /* ============================================================
     開場三頁：六大主題 / 規則 / QR + 代表就位
     ============================================================ */
  .intro-title { font-size: 6.4vh; margin: 0 0 2vh; text-align: center; }

  /* grid-auto-rows 要夾住，否則列高由卡片內容決定，六張卡會撐出容器 */
  .themes {
    display: grid; grid-template-columns: repeat(3, 1fr);
    grid-auto-rows: minmax(0, 1fr);
    gap: 2vh 2vw; flex: 1 1 auto; min-height: 0;
  }
  /* 六大主題直接用整張主視覺；這組樣式只在圖載不出來時當備援 */
  .theme {
    display: grid; place-items: center;
    min-width: 0; min-height: 0;
  }
  .theme .fallback {
    font-size: 3.4vh; font-weight: 900; color: #fff; text-align: center;
    padding: 2vh 1.4vw; border-radius: 1.4vh;
    border: .4vh solid var(--cat); background: rgba(4,9,58,.9);
  }

  .rules { display: flex; gap: 2.6vw; flex: 1 1 auto; min-height: 0; align-items: stretch; }
  .rules ol { flex: 1 1 auto; min-width: 0; margin: 0; padding-left: 1.3em;
              display: flex; flex-direction: column; justify-content: center; gap: 1.5vh; }
  .rules li { font-size: 3.1vh; line-height: 1.38; color: #e6eeff; }
  .rules li b { color: var(--gold-lt); }
  .rules .pic {
    flex: 0 0 42%; min-width: 0;
    display: grid; grid-template-rows: minmax(0, 1fr); grid-template-columns: minmax(0, 1fr);
    place-items: center;
  }
  .rules .pic img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 1.2vh;
    box-shadow: 0 0 0 .3vh rgba(255,200,31,.4), 0 1.4vh 4vh rgba(0,0,0,.6); }

  /* 手機作答示意：用學員端真正的元件樣式組出來，整體再縮放，
     所以跟他們手上看到的畫面一致 */
  .phones { display: flex; gap: 22px; transform-origin: center center; }
  .phone { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .phone figcaption { font-size: 19px; font-weight: 900; color: var(--gold-lt); white-space: nowrap; }
  .phone-screen {
    width: 340px;
    padding: 16px 14px 18px;
    border-radius: 30px;
    border: 7px solid #16265c;
    background: linear-gradient(180deg, #00043f 0%, #050e5e 55%, #00022b 100%);
    box-shadow: 0 0 0 2px rgba(53,168,255,.35), 0 18px 50px rgba(0,0,0,.65);
  }
  /* 示意圖裡的元件不需要互動效果；也不必留手指點擊用的高度，
     壓扁一點整體就能放大一點 */
  .phone-screen .opt { cursor: default; min-height: 54px; }
  .phone-screen .btn { cursor: default; pointer-events: none; padding: 11px 18px; }
  .phone-screen .qpanel { min-height: 92px; margin: 12px 0 14px; padding: 16px 14px; }
  .phone-screen .opts { gap: 9px; }
  .phone-screen .card { padding: 12px; }

  .joinpage { display: flex; gap: 3vw; flex: 1 1 auto; min-height: 0; align-items: stretch; }
  .joinpage .qrside { flex: 0 0 36%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2vh; }
  .joinpage .qrbox { background: #fff; padding: 1.6vh; border-radius: 1.6vh; box-shadow: 0 0 4vh rgba(255,255,255,.35); }
  .joinpage .qrbox img { display: block; width: 32vh; height: 32vh; }
  .joinpage .url { font-size: 2.1vh; color: var(--cyan-lt); word-break: break-all; text-align: center; }
  .joinpage .repside { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
  .joinpage h3 { font-size: 3.4vh; margin: 0 0 1.6vh; text-align: center; }

  .repgrid { display: grid; gap: 1.2vh 1.2vw; flex: 1 1 auto; min-height: 0; align-content: stretch; }
  .repcard {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .4vh;
    border-radius: 1.2vh; border: .3vh solid rgba(53,168,255,.35);
    background: rgba(6,16,80,.6);
    transition: all .35s ease;
  }
  .repcard .nm { font-size: var(--rep-nm, 2.4vh); font-weight: 800; color: #8ea6d8;
                 white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 92%; }
  .repcard .st { font-size: var(--rep-st, 1.9vh); font-weight: 700; color: #4a5a8c; letter-spacing: .1em; }
  .repcard.ready {
    border-color: var(--ok);
    background: linear-gradient(180deg, rgba(12,80,40,.75), rgba(3,30,16,.85));
    box-shadow: 0 0 2.6vh rgba(47,217,107,.5);
    animation: rep-in .5s cubic-bezier(.2,1.6,.4,1);
  }
  .repcard.ready .nm { color: #b6ffd2; }
  .repcard.ready .st { color: #4cf58c; }
  @keyframes rep-in { from { transform: scale(.8); opacity: .3; } to { transform: scale(1); opacity: 1; } }

  /* ============================================================
     排行榜（最終前三名，逐一揭曉）
     ============================================================ */
  .podium { display: flex; align-items: flex-end; justify-content: center; gap: 3vw;
            flex: 1 1 auto; min-height: 0; padding-bottom: 1vh; }
  .place { display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
           flex: 0 0 26%; min-width: 0; opacity: 0; transform: translateY(6vh); }
  .place.shown { animation: place-rise .85s cubic-bezier(.16,1.2,.3,1) forwards; }
  @keyframes place-rise { to { opacity: 1; transform: translateY(0); } }

  .place .medal { font-size: 7.4vh; line-height: 1; margin-bottom: .5vh; }
  .place .gname { font-size: 6.8vh; font-weight: 900; line-height: 1.08; text-align: center;
                  margin-bottom: .6vh; max-width: 100%; }
  .place .score { font-size: 5.2vh; font-weight: 900; margin-bottom: .4vh; color: var(--gold-lt); }
  .place .detail { font-size: 2.5vh; color: var(--txt-dim); margin-bottom: 1vh; }
  .place .block {
    width: 100%; display: grid; place-items: center;
    font-size: 7.4vh; font-weight: 900; color: rgba(255,255,255,.3);
    border-radius: 1.4vh 1.4vh 0 0;
  }
  .place.p1 .block { height: 24vh; background: linear-gradient(180deg, #ffe07a, #d99a00); box-shadow: 0 0 6vh rgba(255,200,31,.75); }
  .place.p2 .block { height: 17.5vh; background: linear-gradient(180deg, #e8eef7, #9aa9bd); box-shadow: 0 0 4vh rgba(200,215,235,.5); }
  .place.p3 .block { height: 12vh; background: linear-gradient(180deg, #e3a76b, #a2632a); box-shadow: 0 0 4vh rgba(210,140,70,.5); }
  .place.p1 .gname { color: var(--gold); text-shadow: 0 0 3vh rgba(255,200,31,.7); }
  .place.p2 .gname { color: #dfe8f5; }
  .place.p3 .gname { color: #f0c095; }
  .place.p1 .medal { animation: medal-bob 1.6s ease-in-out infinite; }
  @keyframes medal-bob { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-1.2vh) scale(1.08); } }

  .confetti { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 5; }
  .confetti i {
    position: absolute; top: -6vh; width: 1.1vh; height: 2.2vh; border-radius: .2vh;
    animation: fall linear forwards;
  }
  @keyframes fall { to { transform: translateY(112vh) rotate(760deg); opacity: .15; } }

  /* ============================================================
     加倍轉盤
     ============================================================ */
  .wheel-overlay {
    position: fixed; inset: 0; z-index: 60;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2vh;
    background: radial-gradient(circle at 50% 45%, rgba(6,18,90,.94), rgba(0,2,26,.97));
    backdrop-filter: blur(4px);
    animation: wheel-in .35s ease;
  }
  @keyframes wheel-in { from { opacity: 0; } }

  .wheel-overlay h2 { font-size: 5.4vh; margin: 0; }
  .wheel-stage { position: relative; width: 62vh; height: 62vh; flex: 0 0 auto; }
  .wheel-stage svg { width: 100%; height: 100%; display: block; }
  /* 旋轉改用 SVG 的 transform 屬性（繞使用者原點＝圓心），
     不要用 CSS transform —— 在 <g> 上 transform-origin 會跑掉，
     轉盤會變成繞著偏移點公轉。 */

  /* 指針（12 點鐘方向） */
  .wheel-ptr {
    position: absolute; top: -1.4vh; left: 50%; transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 2.2vh solid transparent;
    border-right: 2.2vh solid transparent;
    border-top: 4.4vh solid var(--gold);
    filter: drop-shadow(0 .4vh .8vh rgba(0,0,0,.6));
    z-index: 2;
  }
  .wheel-hub {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    width: 11vh; height: 11vh; border-radius: 50%;
    display: grid; place-items: center;
    font-size: 3.4vh; font-weight: 900; color: #6b3b00;
    background: linear-gradient(180deg, #fff2b8, var(--gold) 55%, #dc9400);
    box-shadow: 0 0 3vh rgba(255,200,31,.8), inset 0 0 1.4vh rgba(255,255,255,.5);
    z-index: 2;
  }

  .wheel-result {
    font-size: 5vh; font-weight: 900; text-align: center; min-height: 7vh;
    display: flex; align-items: center; gap: 1.4vw;
  }
  .wheel-result .who {
    background: linear-gradient(180deg, #fff6cf, var(--gold) 45%, #cf8b00);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 2vh rgba(255,200,31,.8));
  }
  .wheel-result .x2 {
    font-size: 6vh; color: #fff;
    padding: .6vh 2vw; border-radius: 999px;
    background: linear-gradient(180deg, #ff7a90, #cc1f3d);
    box-shadow: 0 0 3vh rgba(255,84,112,.8);
    animation: x2-pop .5s cubic-bezier(.2,1.6,.4,1);
  }
  @keyframes x2-pop { from { transform: scale(.4); } to { transform: scale(1); } }
  .wheel-result.pending { color: var(--txt-dim); font-size: 3vh; }

  /* 這一題被加倍的組：格子只用紅框標示，文字放在頂部列，
     否則「第 13 組」這種組名會被 chip 擠成「第…×2」 */
  .cellbox.doubled {
    border-color: #ff5470;
    box-shadow: 0 0 2.6vh rgba(255,84,112,.7), inset 0 0 2vh rgba(255,84,112,.18);
  }
  .dbl-pill {
    display: inline-flex; align-items: center;
    font-size: 2.8vh; font-weight: 900; line-height: 1; color: #fff;
    padding: 1vh 1.8vw; border-radius: 999px; white-space: nowrap;
    background: linear-gradient(180deg, #ff7a90, #cc1f3d);
    box-shadow: 0 0 2.4vh rgba(255,84,112,.75);
  }

  /* ---------- 音效解鎖 ---------- */
  #sound-gate {
    position: fixed; inset: 0; z-index: 90;
    display: grid; place-items: center;
    background: rgba(0,3,30,.92); backdrop-filter: blur(3px);
  }
  #sound-gate .box { text-align: center; max-width: 60vw; }
  #sound-gate .btn { font-size: 2.8vh; padding: 2vh 4vw; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="sweep"></div>

  <div class="top">
    <img class="logo" src="assets/img/logo.png" alt="大學星攻略">
    <span class="cat-pill" id="s-cat">—</span>
    <span class="pts-badge" id="s-pts" style="display:none">+1</span>
    <span class="dbl-pill" id="s-dbl" style="display:none">🎡 ×2</span>
    <span class="qbadge" id="s-badge">第 <b>–</b> 題</span>
  </div>

  <div class="body" id="s-body">
    <div class="center"><div class="spin"></div><p class="hint" style="font-size:2.6vh; margin-top:2vh;">連線中…</p></div>
  </div>

  <div class="foot">
    <span id="s-phase">待機中</span>
    <span id="s-tip"></span>
    <span>崇德志工社　<b>大學星攻略</b></span>
  </div>
</div>

<div id="sound-gate" class="hidden">
  <div class="box">
    <h2 class="title-gold" style="font-size:4.8vh; margin:0 0 1.4vh;">投影統計頁</h2>
    <p class="hint" style="font-size:2.4vh; margin:0 0 3vh;">
      瀏覽器要求先有一次點擊才能播放音效。<br>
      按下之後請按 <b style="color:var(--gold-lt)">F11</b> 進入全螢幕。
    </p>
    <button class="btn" id="btn-sound">🔊 開啟音效並開始</button>
    <p class="hint" style="font-size:2vh; margin-top:2vh;">
      <a href="#" id="btn-nosound" style="color:var(--txt-dim)">不要音效，直接進入</a>
    </p>
  </div>
</div>

<script type="module" src="assets/js/screen.js"></script>
</body>
</html>
